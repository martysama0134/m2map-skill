name: Sync agent variants

# Regenerates every agent-specific copy of the skill from its single source of
# truth (skills/m2map/, agents/, rules/m2map-activate.md).
#
# The sync itself lives in tools/sync.py, NOT inline here, so the identical
# logic runs locally on a dev box with no rsync and no GitHub. CI only calls it.

on:
  push:
    branches: [main]
    paths:
      - skills/m2map/**
      - agents/**
      - rules/m2map-activate.md
      - tools/**
      - tests/**
  pull_request:
    paths:
      - skills/m2map/**
      - agents/**
      - rules/m2map-activate.md
      - tools/**
      - tests/**

concurrency:
  group: sync-skill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # On a PR we only verify. Pushing generated files onto a contributor's branch
  # from CI is rude and breaks forks.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # setup-python does not ship pytest. Without this the gate printed
      # "pytest SKIP" and exited 0, so CI ran no unit tests while looking green.
      - name: Install test dependencies
        run: pip install pytest numpy pillow

      # The full gate, not just the sync check: this also runs
      # scrub_paths.py --check (the host-path leak gate) and the unit tests.
      - name: Full gate
        run: bash tests/run-all.sh

  sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install pytest numpy pillow

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      # Regenerate FIRST. run-all.sh includes `sync.py --check`, so running it
      # before the sync meant the gate failed in exactly the case this job
      # exists to handle -- a source change the contributor did not sync -- and
      # the auto-sync could never fire.
      - name: Regenerate agent variants
        run: python tools/sync.py

      - name: Full gate (verifies the regenerated tree)
        run: bash tests/run-all.sh

      - name: Commit and push if changed
        run: |
          git add -A \
            plugins/m2map \
            .agents/plugins/marketplace.json \
            .clinerules \
            .cursor/rules \
            .windsurf/rules \
            .github/copilot-instructions.md
          git diff --staged --quiet && exit 0
          git commit -m "chore: sync agent variants [skip ci]"
          git push
